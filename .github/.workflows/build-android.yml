name: "Build PHIMTNUI Android & TV APKs"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apks:
    name: "Bien dich APKs (Mobi & Smart TV)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4

      - name: 2. Cai dat Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cai dat Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Build giao dien Web & Dong bo Capacitor
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build
          npx @capacitor/cli sync android

      - name: 5. Build APK cho Dien thoai (PHIMTNUI MobiTV)
        run: |
          mkdir -p release-apks
          cd frontend/android
          chmod +x ./gradlew

          # Gan manifest cho dien thoai Samsung/Android (Man hinh doc, cam ung)
          if [ -f "../android-setup/AndroidManifest.mobitv.xml" ]; then
            cp -f ../android-setup/AndroidManifest.mobitv.xml app/src/main/AndroidManifest.xml
          fi
          sed -i 's/applicationId "[^"]*"/applicationId "com.phimtnui.mobitv"/' app/build.gradle
          sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">PHIMTNUI Mobi<\/string>/' app/src/main/res/values/strings.xml || true

          # Bien dich APK (Debug key san co, cai ngay khong loi)
          ./gradlew assembleDebug --no-daemon

          MOBI_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$MOBI_APK" ] && [ -f "$MOBI_APK" ]; then
            cp -f "$MOBI_APK" ../../release-apks/PHIMTNUI-MobiTV.apk
            echo "=== DA TAO XONG: PHIMTNUI-MobiTV.apk ==="
          else
            echo "Loi khong tim thay file APK Mobi"
            exit 1
          fi

      - name: 6. Build APK cho Smart TV & Android Box (PHIMTNUI AndroidTV)
        run: |
          mkdir -p release-apks
          cd frontend/android
          chmod +x ./gradlew

          # Gan manifest chuyen dung cho Smart TV (Leanback banner, D-Pad Remote, khong can cam ung)
          if [ -f "../android-setup/AndroidManifest.androidtv.xml" ]; then
            cp -f "../android-setup/AndroidManifest.androidtv.xml" app/src/main/AndroidManifest.xml
          fi
          sed -i 's/applicationId "[^"]*"/applicationId "com.phimtnui.androidtv"/' app/build.gradle
          sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">PHIMTNUI TV<\/string>/' app/src/main/res/values/strings.xml || true

          # Bien dich APK cho TV
          ./gradlew assembleDebug --no-daemon

          TV_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$TV_APK" ] && [ -f "$TV_APK" ]; then
            cp -f "$TV_APK" ../../release-apks/PHIMTNUI-AndroidTV.apk
            echo "=== DA TAO XONG: PHIMTNUI-AndroidTV.apk ==="
          else
            echo "Loi khong tim thay file APK Android TV"
            exit 1
          fi

      - name: 7. Tao ma kiem tra Checksum SHA-256
        run: |
          cd release-apks
          ls -lh
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 8. Luu Artifact de tai ve truc tiep tu Actions
        uses: actions/upload-artifact@v4
        with:
          name: PHIMTNUI-APKs
          path: |
            release-apks/PHIMTNUI-MobiTV.apk
            release-apks/PHIMTNUI-AndroidTV.apk
            release-apks/SHA256SUMS.txt

      - name: 9. Tu dong tao Release & Dinh kem file APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.0-apk"
          name: "PHIMTNUI v1.0.0 - Android & Smart TV APKs"
          draft: false
          prerelease: false
          files: |
            release-apks/PHIMTNUI-MobiTV.apk
            release-apks/PHIMTNUI-AndroidTV.apk
            release-apks/SHA256SUMS.txt

